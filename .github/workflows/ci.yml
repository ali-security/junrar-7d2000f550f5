name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Test class names (or a Gradle selector such as test --tests FooTest); empty runs the full build'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        java: [ 8, 11, 17, 18 ]
    name: Test JDK ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v2
        with:
          java-version: ${{ matrix.java }}
          java-package: 'jdk'
          distribution: 'temurin'
      - name: Print test counts
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/test-count.gradle <<'INIT'
          allprojects {
              tasks.withType(Test).configureEach {
                  testLogging {
                      events 'passed', 'skipped', 'failed'
                  }
                  afterSuite { desc, result ->
                      if (desc.parent == null) {
                          println("TEST SUMMARY [${project.path}:${name}]: ${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped")
                      }
                  }
              }
          }
          INIT
      - name: Test filter
        id: filter
        if: inputs.test-filter != ''
        run: |
          FILTER="${{ inputs.test-filter }}"
          case "$FILTER" in
            *--tests*) echo "args=assemble jar $FILTER" >> "$GITHUB_OUTPUT" ;;
            *) echo "args=assemble jar test $(printf -- '--tests %s ' $FILTER)" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Build
        uses: gradle/gradle-build-action@v2
        with:
          arguments: ${{ steps.filter.outputs.args || 'build jar -x checkstyleMain -x checkstyleTest -x checkstyleRegressionTest' }}
      - name: Jacoco
        uses: gradle/gradle-build-action@v2
        with:
          arguments: jacocoTestReport
      - uses: codecov/codecov-action@v2
        if: false
      - uses: actions/upload-artifact@v4
        if: matrix.java == '8'
        with:
          name: junrar-jars
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    name: semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    if: false
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v2
        with:
          node-version: '16'
          cache: 'npm'
      - uses: actions/setup-java@v2
        with:
          java-version: '8'
          java-package: 'jdk'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.MAVENCENTRAL_USER }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.MAVENCENTRAL_PASSWORD }}
        run: npx semantic-release
